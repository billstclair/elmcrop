<html>
  <head>
    <meta charset="UTF-8">

    <meta property="og:description" content="ElmCrop" />
    <meta property="og:url" content="http://localhost:8000/site/index.html" />

  <body style='width: 40em; margin: auto; margin-top: 2em;'>
    <noscript>
      <h2 style='text-align: center;'>ElmCrop</h2>
      <p>A clone of EasyCrop for the web.</p>
      <p style='font-color: red;'>
        <b>ElmCrop requires JavaScript to function. Without JavaScript,
          this page is all you'll ever see.</b>
      </p>
      <p style='text-align: center;'>
        <img src='images/icon-512.png' width='360' height='360' alt='Elm Webapp Template'/>
      </p>
      <p style='text-align: center;'>
        <a href='https://github.com/billstclair/elmcrop'>GitHub</a>
      </p>
    </noscript>
    <script type='text/javascript'>
      // It's an application, so it doesn't need a div.
      if (typeof Elm !== 'undefined') {
        var elm = Elm;
        if (!elm) {
          console.log("elm.js does not define the symbol 'Elm'.");
        } else {
          var app = elm['Main'];
          if (!app) {
            console.log("Elm.Main.app is not defined.");
          } else {
            app = app.init({ flags: true });

            localstorage(app);

            // Ports
            // A couple of representative port definitions.
            // Add your own here.
            // port selectAll : String -> Cmd msg
            var selectAll = app && app.ports && app.ports.selectAll;
            if (selectAll) {
              selectAll.subscribe(function(id) {
                let element = document.getElementById(id);
                if (element) {
                  element.select();
                }
              });
            }
            // port openWindow : Value -> Cmd msg
            var openWindow = app && app.ports && app.ports.openWindow;
            if (openWindow) {
              openWindow.subscribe(function(url) {
                window.open(url, '_blank');
              });
            }
          }
        }
      }
    </script>
  </body>
</html>
