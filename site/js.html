<html>
  <head>
    <title>js.html</title>
  </head>
  <body>
    <h1>js.html</h1>
    <h2>Playground for JavaScript learning.</h2>
    <div id="drophere" style='width: 200; height: 8.5em; border: 2px solid green;'>
       <div style='margin-left: 4em; margin-top: 4em;'>
         A drop <code>div</code>
       </div>
     </div>
    <textarea rows='5' cols='30' id='dropreport'>
    </textarea>
     <script>
       const drophere = document.getElementById('drophere');
       const dropreport = document.getElementById('dropreport');
       var dropevent = null;
       drophere.addEventListener('dragover', (ev) => {
         ev.preventDefault();
       });
       drophere.addEventListener('drop', (ev) => {
         ev.preventDefault();
         dropevent = ev;
         console.log(ev);
         dropreport.value = ev.dataTransfer.items;
         dropreport.value = ev.dataTransfer.types;
         if (ev.dataTransfer.items) {
           for (const item of ev.dataTransfer.items) {
             console.log(`kind = ${item.kind}, type = ${item.type}`);
           }
         };
       });
     </script>
     <p><a href='https://github.com/billstclair/elmcrop'>GitHub</a></p>
  </body>
</html>
