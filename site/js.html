  <body>
    <h1>js.html</h1>
    <h2>Playground for JavaScript learning.</h2>
    <div id="drophere" style='width: 200; height: 8.5em; border: 2px solid green;'>
       <div style='margin-left: 4em; margin-top: 4em;'>
         A drop <code>div</code>
       </div>
     </div>
     <script>
       const drophere = document.getElementById('drophere');
       drophere.addEventListener('dragover', (ev) => {
         ev.preventDefault();
       });
       drophere.addEventListener('drop', (ev) => {
         ev.preventDefault();
         console.log('ev: ', ev);
       });
     </script>
